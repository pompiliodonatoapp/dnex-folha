name: DNEX Folha quality preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
concurrency:
  group: folha-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Static and contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate folha handoff contract
        shell: bash
        run: python3 scripts/validate_folha_handoff.py
      - name: Assert clean workspace
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"